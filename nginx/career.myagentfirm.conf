# ============================================================
# /etc/nginx/sites-available/career-copilot
# career.myagentfirm.com — Career Copilot OS
#
# Simpler than the previous SPA setup: Fastify serves both the API
# and the static pages, so nginx is a single reverse proxy.
#
# SSL: Cloudflare Full (Strict) + Origin Certificate
# Backend: http://127.0.0.1:4011
# ============================================================

server {
    listen 80;
    listen [::]:80;
    server_name career.myagentfirm.com;
    return 301 https://career.myagentfirm.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name career.myagentfirm.com;

    ssl_certificate     /etc/ssl/cloudflare/myagentfirm.com.pem;
    ssl_certificate_key /etc/ssl/cloudflare/myagentfirm.com.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Restore the real visitor IP from Cloudflare.
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    real_ip_header CF-Connecting-IP;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript text/javascript image/svg+xml;
    gzip_min_length 1000;
    gzip_vary on;

    # Interview recordings upload in small chunks; 25M is ample headroom.
    client_max_body_size 25M;

    location / {
        proxy_pass http://127.0.0.1:4011;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;

        # WIN doc and resume tailoring run two AI calls back to back.
        proxy_read_timeout 300s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
    }

    location = /health {
        proxy_pass http://127.0.0.1:4011/api/health;
        proxy_set_header Host $host;
        access_log off;
    }

    access_log /var/log/nginx/career_copilot_access.log;
    error_log  /var/log/nginx/career_copilot_error.log;
}
