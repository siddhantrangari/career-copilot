# ============================================================
# /etc/nginx/sites-available/career-copilot
# VPS host-level nginx for career.myagentfirm.com
#
# SSL: Cloudflare Full (Strict) + Origin Certificate
# — Origin cert *.myagentfirm.com secures VPS <-> Cloudflare
# — Cloudflare terminates public HTTPS
#
# Static files: /var/www/career-copilot-frontend
# Backend API:  http://127.0.0.1:4005/api
# ============================================================

# ── Cloudflare real-IP restoration ────────────────────────────────────────────
geo $realip_remote_addr $cloudflare_ip_career {
    default          0;
    103.21.244.0/22  1;
    103.22.200.0/22  1;
    103.31.4.0/22    1;
    104.16.0.0/13    1;
    104.24.0.0/14    1;
    108.162.192.0/18 1;
    131.0.72.0/22    1;
    141.101.64.0/18  1;
    162.158.0.0/15   1;
    172.64.0.0/13    1;
    173.245.48.0/20  1;
    188.114.96.0/20  1;
    190.93.240.0/20  1;
    197.234.240.0/22 1;
    198.41.128.0/17  1;
}

# ── HTTP -> HTTPS redirect ─────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name career.myagentfirm.com;
    return 301 https://career.myagentfirm.com$request_uri;
}

# ── Main HTTPS server ─────────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name career.myagentfirm.com;

    # ── Cloudflare Origin Certificate ──────────────────────────────────────────
    ssl_certificate     /etc/ssl/cloudflare/myagentfirm.com.pem;
    ssl_certificate_key /etc/ssl/cloudflare/myagentfirm.com.key;

    # Modern SSL settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # ── Restore real visitor IP from Cloudflare header ─────────────────────────
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    real_ip_header CF-Connecting-IP;

    # ── Security headers ───────────────────────────────────────────────────────
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Permissions-Policy "camera=(), microphone=(self), geolocation=()" always;

    # ── Gzip ───────────────────────────────────────────────────────────────────
    gzip on;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 1000;
    gzip_vary on;

    # ── API proxy -> Career Copilot Node API ────────────────────────────────────
    location /api/ {
        proxy_pass http://127.0.0.1:4005/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_cache_bypass $http_upgrade;

        # AI completions and ATS scanner can take up to 300s
        proxy_read_timeout 300s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;

        client_max_body_size 25M;
    }

    # ── Health check ──────────────────────────────────────────────────────────
    location = /health {
        proxy_pass http://127.0.0.1:4005/api/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }

    # ── Frontend SPA ──────────────────────────────────────────────────────────
    root /var/www/career-copilot-frontend;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;

        # Immutable cache for Vite-hashed bundles
        location ~* \.(js|css|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable" always;
            access_log off;
        }

        # Short cache for images / icons
        location ~* \.(png|jpg|jpeg|gif|ico|svg|webp)$ {
            expires 30d;
            add_header Cache-Control "public" always;
            access_log off;
        }
    }

    # Logs
    access_log /var/log/nginx/career_copilot_access.log;
    error_log  /var/log/nginx/career_copilot_error.log;
}
